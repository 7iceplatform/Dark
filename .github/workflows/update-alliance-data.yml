name: Update alliance data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public alliance snapshot
        run: |
          mkdir -p data
          curl --fail --silent --show-error --retry 3 \
            https://lastasylum.gg/api/alliance/67172519 \
            --output data/alliance.json

      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/alliance.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: refresh alliance snapshot"
          git push
