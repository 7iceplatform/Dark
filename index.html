<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R4 · Alliance Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="alliance-tag" id="alliance-tag">DARK</div>
            <h1 class="alliance-name" id="alliance-name">Загрузка...</h1>
            <div class="alliance-meta">
                <span id="alliance-server">Сервер: ...</span> • 
                <span id="alliance-members">Участники: ...</span>
            </div>
        </header>

        <main>
            <section class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Общая сила</span>
                    <span class="stat-value" id="total-power">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Убийства</span>
                    <span class="stat-value" id="total-kills">-</span>
                </div>
            </section>

            <section class="chart-section">
                <h2>Динамика силы</h2>
                <div class="chart-container">
                    <canvas id="powerChart"></canvas>
                </div>
            </section>

                        <section class="roster-section">
                <div class="section-header">
                    <h2>Участники</h2>
                    <!-- Место для кнопки экспорта, как на скрине -->
                    <div class="export-btn">Export ▾</div> 
                </div>
                
                <!-- Контейнер для карточек -->
                <div class="roster-list" id="roster-list">
                    <div class="loading-text">Загрузка данных...</div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
